name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: "Build and Release APK"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Configure release signing
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.GOLD_EX_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.GOLD_EX_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.GOLD_EX_RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.GOLD_EX_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          test -n "$RELEASE_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/goldex-signing"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/goldex-signing/release.keystore"
          test -s "$RUNNER_TEMP/goldex-signing/release.keystore"
          {
            echo "GOLD_EX_RELEASE_STORE_FILE=$RUNNER_TEMP/goldex-signing/release.keystore"
            echo "GOLD_EX_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "GOLD_EX_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "GOLD_EX_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Release APK
        run: |
          set -e -o pipefail
          touch build.log
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log
          test -f app/build/outputs/apk/release/app-release.apk
          test ! -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Report Build Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create ci-build-failure --force || true
          touch build.log
          echo "### CI Build Failure" > issue_body.md
          echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> issue_body.md
          echo "Commit: ${{ github.sha }}" >> issue_body.md
          echo "Tag: ${{ github.ref_name }}" >> issue_body.md
          echo "" >> issue_body.md
          echo "#### Build Log (last 80 lines):" >> issue_body.md
          echo '```' >> issue_body.md
          tail -n 80 build.log >> issue_body.md
          echo '```' >> issue_body.md

          gh issue create \
            --title "CI Build Failure on ${{ github.ref_name }}" \
            --label "ci-build-failure" \
            --body-file issue_body.md

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          name: "قیراط (Qirat) ${{ github.ref_name }}"
