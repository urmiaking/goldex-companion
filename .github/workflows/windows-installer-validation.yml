name: Validate Windows installer
on:
  pull_request:
    paths:
      - 'desktop/packaging/**'
      - 'desktop/src/main/kotlin/com/goldex/companion/desktop/update/**'
      - 'desktop/src/main/resources/update/**'
      - '.github/workflows/windows-installer-validation.yml'
permissions:
  contents: read
concurrency:
  group: windows-installer-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      # Unit tests stay local; installation needs a disposable Windows user.
      - name: Build native image and installer
        shell: pwsh
        run: |
          ./gradlew.bat :desktop:createDistributable --no-daemon -q
          if ($LASTEXITCODE -ne 0) { throw 'Native image build failed' }
          ./desktop/packaging/build-installer.ps1
      - name: Verify installation upgrade and shipped updater helper
        shell: pwsh
        run: |
          $version = (Get-Content desktop/version.properties) -replace '^version=', ''
          ./desktop/packaging/verify-installer.ps1 -Version $version
